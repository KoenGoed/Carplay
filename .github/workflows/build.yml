name: Bouw Autoscherm

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ci/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'WIJZIGINGEN.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bouwen en als update publiceren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/build.sh
