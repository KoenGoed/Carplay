name: Diagnose

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Maximumsnelheid-dienst testen
        run: |
          set +e
          Q='[out:json][timeout:8];way(around:60,52.5096,5.4874)[highway][~"^maxspeed"~"."];out tags geom;'
          for ua in "Autoscherm/1.0 (persoonlijke auto-app)" "Dalvik/2.1.0 (Linux; U; Android 14)"; do
            for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
              code=$(curl -s -o out.json -w "%{http_code}" --max-time 20 -A "$ua" --data-urlencode "data=$Q" "$ep")
              n=$(python3 -c "import json;print(len(json.load(open('out.json'))['elements']))" 2>/dev/null || echo "geen json: $(head -c 120 out.json | tr '\n' ' ')")
              echo "::notice::$ep | UA=$ua | HTTP $code | wegen=$n"
            done
          done
          python3 -c "import json;d=json.load(open('out.json'));print('::notice::voorbeeld', [ (e['tags'].get('name'), e['tags'].get('maxspeed')) for e in d['elements'][:5]])" || true
