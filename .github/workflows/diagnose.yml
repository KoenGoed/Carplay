name: Diagnose

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Bronnen testen
        run: |
          set +e
          for u in \
            https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.47/vosk-android-0.3.47.aar \
            https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.45/vosk-android-0.3.45.aar \
            https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.aar \
            https://alphacephei.com/vosk/models/vosk-model-small-nl-0.22.zip \
            "https://api.tomtom.com/search/2/reverseGeocode/52.5,5.47.json?key=x"; do
            code=$(curl -s -o /dev/null -L -I -w "%{http_code} %{size_download} %header{content-length}" --max-time 20 "$u")
            echo "::notice::$u -> $code"
          done
          curl -s -L --max-time 20 https://alphacephei.com/vosk/models | grep -o 'vosk-model[a-z-]*nl[^"<]*zip' | sort -u | while read m; do echo "::notice::model $m"; done
